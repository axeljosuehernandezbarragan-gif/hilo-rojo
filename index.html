<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160F24">
  <title>Hilo Rojo</title>
  <meta name="description" content="Juego narrativo sobre seguridad y ciudadanía digital: una semana en la vida de Yare antes de la Feria del Bordado.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232A1F3D'/%3E%3Cpath d='M4 16c4-8 8 4 12-4s4 2 4 2' fill='none' stroke='%23E0303F' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/juego.css?v=42">
</head>
<body>
  <div id="juego">
    <div id="escenario" aria-hidden="true"></div>

    <div id="hud">
      <span id="etiqueta"></span>
      <div class="hud-btns">
        <button id="rapido" type="button" aria-pressed="false" title="Texto rápido: muestra cada texto completo de inmediato" aria-label="Texto rápido"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l7 6-7 6z"/><path d="M12 6l7 6-7 6z"/></svg></button>
        <button id="menu" type="button" title="Menú" aria-label="Menú" aria-controls="menu-juego"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      </div>
    </div>

    <div id="avisos" aria-live="polite"></div>

    <div id="caja" class="caja" aria-live="polite">
      <div class="reloj"><i></i></div>
      <span class="nombre"></span>
      <div class="texto"></div>
      <div class="opciones"></div>
    </div>

    <div id="tel" class="tel"></div>

    <div id="menu-juego" class="menu-juego" hidden>
      <div class="menu-caja" role="dialog" aria-label="Menú">
        <p class="sup">Pausa</p>
        <button class="boton" data-m="seguir">Seguir jugando</button>
        <button class="boton vacio" data-m="portada">Volver a la portada <small>(se guarda tu avance)</small></button>
        <button class="boton vacio" data-m="reiniciar">Empezar de nuevo <small>(borra tu avance)</small></button>
        <a class="boton vacio" href="propuesta.html">Leer la propuesta</a>
        <div class="ajustes-sonido">
          <p class="sup">Sonido</p>
          <label><input type="checkbox" data-s="musica"> Música</label>
          <label><input type="checkbox" data-s="efectos"> Ambiente y efectos</label>
          <label><input type="checkbox" data-s="voces"> Voces (teclado cuando alguien habla, lápiz cuando se narra)</label>
          <label class="vol">Volumen <input type="range" min="0" max="1" step="0.05" data-s="volumen"></label>
        </div>
      </div>
    </div>
    <div id="panel" class="panel"></div>
  </div>

  <noscript><p style="color:#fff;padding:24px">Este juego necesita JavaScript.</p></noscript>
  <script src="js/iconos.js?v=42"></script>
  <script src="js/personajes.js?v=42"></script>
  <script src="js/escenarios.js?v=42"></script>
  <script src="js/sonido.js?v=42"></script>
  <script src="js/entrada.js?v=42"></script>
  <script src="js/motor.js?v=42"></script>
  <script src="js/cine.js?v=42"></script>
  <script src="js/ciber.js?v=42"></script>
  <script src="js/caminar.js?v=42"></script>
  <script src="js/capitulo1.js?v=42"></script>
  <script src="js/capitulo2.js?v=42"></script>
  <script src="js/capitulo3.js?v=42"></script>
  <script src="js/capitulo4.js?v=42"></script>
  <script src="js/capitulo5.js?v=42"></script>
  <script src="js/historia.js?v=42"></script>
  <script>Motor.iniciar(HISTORIA);</script>
</body>
</html>
